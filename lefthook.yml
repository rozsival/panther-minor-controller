commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - run: cargo fmt
      glob:
        - '**/*.rs'
      stage_fixed: true

    - run: cargo check --workspace
      glob:
        - '**/*.rs'
      stage_fixed: true

    - run: cargo clippy --workspace -- -D warnings
      glob:
        - '**/*.rs'
      stage_fixed: true

    # In order: format the shell sources, then lint what was formatted.
    - name: shell
      group:
        piped: true
        jobs:
          - run: pnpm prettier --write {staged_files}
            glob:
              - '**/*.sh'
            stage_fixed: true

          - run: pnpm run check:sh
            glob:
              - '**/*.sh'

    - run: pnpm prettier --write {staged_files}
      glob:
        - '**/*.md'
        - '**/*.toml'
        - '**/*.yaml'
        - '**/*.yml'
        - '**/*.json'
        - 'panther-minor-controller.code-workspace'
      stage_fixed: true
