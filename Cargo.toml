[package]
name = "panther-minor-controller"
version = "1.0.8"
edition = "2024"
description = "Remote controller for Panther Minor AI workstation"
license = "MIT"

[dependencies]
hyper = { version = "=1.11.0", features = ["full"] }
http-body = "=1.1.0"
hyper-util = { version = "=0.1.20", features = ["full"] }
http-body-util = "=0.1.5"
tokio = { version = "=1.53.1", features = ["full"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
async-trait = "=0.1.92"

[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "=0.22.1", features = ["hal"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
